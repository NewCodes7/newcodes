# Blue-Green 배포 대상 upstream
# 전환 시: server 주소를 newcodes-backend-green:8080 으로 변경 후 nginx -s reload
upstream backend {
    zone backend 64k;
    server newcodes-backend-blue:8080 resolve;
}

# 부하테스트(Fargate) 전용 예외 — Fargate 태스크가 매번 임의 public IP를 쓰므로(IP 고정 불가)
# 고정 IP 대신 시크릿 헤더(X-LoadTest-Token)로 판별한다. $loadtest_bypass 변수 자체는 그대로 재사용.
# 실제 $loadtest_bypass 매핑(시크릿 토큰 값)은 nginx/loadtest_token.conf(gitignore 대상, 이 디렉터리에 위치,
# nginx.conf의 `include conf.d/*.conf`로 자동 포함됨)에 있다 — 템플릿은 loadtest_token.conf.example 참고.
# 상시 등록 상태로 유지한다(load-test/fargate/MOCK_SERVICE_SETUP.md 참고) — 토큰 로테이션 시에만 그 파일을 갱신할 것.
map $loadtest_bypass $limit_key {
    0 $binary_remote_addr;
    1 "";  # 빈 문자열 키 → nginx가 해당 요청은 rate limit 카운트에서 제외
}

# Rate limiting 설정
limit_req_zone $limit_key zone=general:10m rate=10r/s;
limit_req_zone $limit_key zone=api:10m rate=120r/m;
limit_req_zone $limit_key zone=autocomplete:10m rate=10r/s;  # 자동완성 전용 (초당 10회)
limit_req_zone $limit_key zone=static:10m rate=50r/s;
limit_req_zone $limit_key zone=ai_summary:10m rate=5r/m;  # AI 요약 전용 (분당 5회)
limit_req_zone $limit_key zone=rag_answer_min:10m rate=10r/m;  # RAG 챗봇 - 분당 10회
# 시간당 30회 제한은 nginx limit_req(정수 r/s·r/m만 지원, 소수점 rate 불가)로 표현 불가 →
# 애플리케이션에서 rag_query_log.ip_address/created_at 기준 카운트 쿼리로 처리 (RagChatController 참고)

# HTTP to HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name newcodes.net www.newcodes.net;

    # Let's Encrypt 인증서 갱신을 위한 설정
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 모든 요청을 HTTPS + 정규 호스트(newcodes.net)로 한 번에 리다이렉트
    # (www로 들어와도 http → https://www → https://apex 두 단계를 거치지 않게)
    location / {
        return 301 https://newcodes.net$request_uri;
    }
}

# 프록시 캐시 설정
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=newcodes_cache:10m max_size=1g inactive=60m;

# HTTPS 서버
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # www는 파일 끝의 별도 server 블록에서 apex로 301 (같은 페이지를 두 호스트로 200 서빙하지 않음).
    # 이 블록이 443의 첫 server라 Host가 매칭되지 않는 요청의 기본 서버 역할도 그대로 유지된다.
    server_name newcodes.net;

    # SSL 인증서 설정
    ssl_certificate /etc/letsencrypt/live/newcodes.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newcodes.net/privkey.pem;

    # Let's Encrypt 추가 설정 포함
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # 보안 헤더 추가
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 클라이언트 업로드 크기 제한
    client_max_body_size 10M;


    # /admin/monitor → /admin/monitor/ (trailing slash 없이 접속 시 백엔드로 새지 않도록)
    location = /admin/monitor {
        return 301 /admin/monitor/;
    }

    # 해당 엔드포인트는 캐시하지 않음
    # Grafana 9.2+ 는 serve_from_sub_path=true일 때 prefix 없는 요청을 root_url로 리다이렉트하므로
    # prefix를 벗기지 말고 그대로 전달해야 함 (proxy_pass 끝에 / 금지 — 리다이렉트 루프 원인)
    location ^~ /admin/monitor/ {
        proxy_pass http://grafana:3000;

        # 버퍼링 설정 (큰 대시보드용)
        proxy_buffering off;
        proxy_buffer_size 4k;

        # WebSocket 지원
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 기존 헤더들
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # 캐시 비활성화
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # 타임아웃
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # AI 요약 SSE API - 분당 5회 rate limit, 버퍼링 비활성화 필수
    location = /api/search/ai-summary {
        limit_req zone=ai_summary burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # SSE 스트리밍을 위해 버퍼링 비활성화
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # SSE 연결 유지 (SseEmitter 30s + 여유)
        proxy_connect_timeout 10s;
        proxy_send_timeout 40s;
        proxy_read_timeout 40s;
    }

    # RAG 챗봇 SSE API (실사용자용) - 분당 10회 rate limit(nginx), 시간당 30회는 app에서 처리
    location = /api/rag/answer {
        limit_req zone=rag_answer_min burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # SSE 스트리밍을 위해 버퍼링 비활성화
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # SSE 연결 유지 (SseEmitter 150s + 여유)
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # RAG 부하테스트 SSE API (LLM mock 경유) - X-LoadTest-Token 헤더가 일치해야 통과, 그 외 403.
    # 앱에서도 rag.chat.loadtest.enabled(기본 false)로 게이트 — 비활성 시 404 (load-test/README.md)
    location = /api/rag/answer/loadtest {
        if ($loadtest_bypass = 0) {
            return 403;
        }

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # SSE 스트리밍을 위해 버퍼링 비활성화
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # SSE 연결 유지 (SseEmitter 150s + 여유, 실사용자 경로와 동일)
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # 검색 부하테스트 API (Clova 임베딩 mock 경유) - X-LoadTest-Token 헤더가 일치해야 통과, 그 외 403.
    # 앱에서도 search.loadtest.enabled(기본 false)로 게이트 — 비활성 시 404 (load-test/README.md).
    # 실사용자 경로(/api/search/articles)와 URL이 달라 rate limit(zone)도 별도로 적용되지 않는다.
    location = /api/search/articles/loadtest {
        if ($loadtest_bypass = 0) {
            return 403;
        }

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 관리자 RAG SSE API - Gemini 호출(최대 5분) 동안 이벤트가 없어도 연결 유지
    # TODO: 임시 조치 (2026-07-09) — Gemini 타임아웃 원인 규명 후 타임아웃 재조정 필요
    location = /api/admin/rag/answer {
        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # SSE 스트리밍을 위해 버퍼링 비활성화
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # SSE 연결 유지 (SseEmitter 660s + 여유)
        proxy_connect_timeout 10s;
        proxy_send_timeout 700s;
        proxy_read_timeout 700s;
    }

    # 부하테스트 Prometheus remote-write 프록시 — X-LoadTest-Token 일치해야 통과, 그 외 403.
    # 9090을 인터넷에 직접 열지 않기 위한 경로(k6는 K6_PROMETHEUS_RW_HTTP_HEADERS로 같은 토큰을 실어 보냄).
    location ^~ /loadtest-prom/ {
        if ($loadtest_bypass = 0) {
            return 403;
        }

        proxy_pass http://prometheus:9090/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        client_max_body_size 20M;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 자동완성 API - 별도 rate limit (연속 호출 허용)
    location = /api/autocomplete {
        limit_req zone=autocomplete burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # 해당 엔드포인트는 캐시하지 않음
    location ^~ /api/ {
        # Rate limiting
        limit_req zone=api burst=10 nodelay;
        limit_req_status 444;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # keepalive 연결 활성화 (HTTP/2 연속 요청 시 필수)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Actuator는 Admin 서버에서만 접근 가능
    location ^~ /actuator/ {
        # Rate limiting
        limit_req zone=general burst=5 nodelay;
        limit_req_status 444;

        allow 127.0.0.1;
        deny all;

        proxy_pass http://backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # keepalive 연결 활성화
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 정적 리소스 캐싱 (CSS, JS, 이미지 등)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Rate limiting
        limit_req zone=static burst=20 nodelay;
        limit_req_status 444;

        proxy_pass http://backend;
        proxy_cache newcodes_cache;
        proxy_cache_valid 200 1d;
        expires 1d;

        # keepalive 연결 활성화
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 위에서 명시한 경로 빼고는 모두 캐시
    location / {
        # Rate limiting
        limit_req zone=general burst=5 nodelay;
        limit_req_status 444;

        proxy_pass http://backend;
        proxy_cache newcodes_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_valid 500 502 503 504 1m;
        proxy_cache_bypass $http_cache_control;
        proxy_cache_background_update on;
        # 백엔드가 죽거나(OOM 재기동·부하테스트) 타임아웃이면 캐시에 남은 페이지를 그대로 내준다.
        # 2026-08-27 부하테스트 중 12분간 502가 1만 건 넘게 났고, 이틀 뒤 색인 수가 약 1,600개 줄었다.
        proxy_cache_use_stale error timeout http_502 http_503 http_504 updating;

        # 캐시에도 없으면 502/504 대신 503 + Retry-After — "잠시 후 다시 오라"는 크롤러용 신호.
        # (nginx가 직접 만든 502/504만 해당. /api/* location은 부하테스트 집계가 502를 세므로 건드리지 않는다)
        # '=503'이 없으면 named location의 return 503이 있어도 원래 코드(502)가 나간다(로컬 nginx로 확인).
        error_page 502 504 =503 @backend_unavailable;

        # keepalive 연결 활성화 (HTTP/2 연속 요청 시 필수)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 프록시 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 버퍼링 설정
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 백엔드 일시 불가 응답 (location / 의 error_page 대상)
    location @backend_unavailable {
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        default_type "text/html; charset=utf-8";
        return 503 '<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>잠시 후 다시 시도해 주세요 - NewCodes</title><meta name="robots" content="noindex"></head><body><h1>잠시 점검 중입니다</h1><p>잠시 후 다시 시도해 주세요.</p></body></html>';
    }
}

# www.newcodes.net → newcodes.net 정규화 (SEO: 중복 호스트 제거)
# 인증서는 기존 newcodes.net 인증서가 www도 포함하므로 그대로 쓴다.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.newcodes.net;

    ssl_certificate /etc/letsencrypt/live/newcodes.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newcodes.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://newcodes.net$request_uri;
}
